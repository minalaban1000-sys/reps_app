workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build app bundle or debug
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/**